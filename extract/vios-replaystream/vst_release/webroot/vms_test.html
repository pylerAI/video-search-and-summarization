<body>
  <p id="apiPath" style="display: block; color: black; float: left; position: relative; margin-right: 5px;"></p>
  <p id="iterationNumber" style="display: block; color: black; float: left; margin-right: 5px;"></p>
  <script>
    function openForm() {
      document.getElementById("myForm").style.display = "block";
      document.getElementById("overlay").style.display = "block";
      populateCameraList();
    }
    function closeForm() {
      document.getElementById("myForm").style.display = "none";
      document.getElementById("overlay").style.display = "none";
    }
    function submitForm() {
      let username = document.getElementById("username").value;
      let password = document.getElementById("password").value;
      let dropdown = document.getElementById("cameraDropdown");
      let cameraId = dropdown.value;
      let addCameraIp = document.getElementById("addCameraIp").value;
      let addCameraUser = document.getElementById("addCameraUser").value;
      let addCameraPassword = document.getElementById("addCameraPassword").value;
      let addCameraRtsp = document.getElementById("addCameraRtsp").value;
      setCookie("username", username, 2);
      setCookie("password", password, 2);
      if(username === "" || password === "" || cameraId === "" || addCameraIp === "" || 
        addCameraUser === "" || addCameraPassword == "" || addCameraRtsp === "") {
          alert("Please provide all fields");
          return;
        }
      let data = {
        username: username,
        password: password
      };
      document.getElementById("submitFormButton").innerHTML = "Sending data";
      fetch(`api/device/${cameraId}/credentials`, {
        method: "POST", 
        body: JSON.stringify(data)
      }).then(res => {
        console.log("Request complete! response:", res);
        document.getElementById("submitFormButton").innerHTML = "Submit";
        if(res.status !== 200) {
          const errorCodeDescription = "Request failed";
        }
        closeForm();
        startTest();
      }).catch((e) => {
        document.getElementById("submitFormButton").innerHTML = "Submit";
        alert("Request failed");
      });
      window.parent.updateCameraId(cameraId, username, password, addCameraIp, addCameraUser, addCameraPassword, addCameraRtsp);
    }
    function setCookie(cname, cvalue, exdays) {
      const d = new Date();
      d.setTime(d.getTime() + (exdays * 24 * 60 * 60 * 1000));
      let expires = "expires="+d.toUTCString();
      document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
    }
    function getCookie(cname) {
      let name = cname + "=";
      let ca = document.cookie.split(';');
      for(let i = 0; i < ca.length; i++) {
        let c = ca[i];
        while (c.charAt(0) == ' ') {
          c = c.substring(1);
        }
        if (c.indexOf(name) == 0) {
          return c.substring(name.length, c.length);
        }
      }
      return "";
    }
    function checkCookie(cname) {
      let user = getCookie(cname);
      if (user != "") {
        return true;
      } else {
        return false;
      }
    }
    function populateCameraList() {
      let dropdown = document.getElementById('cameraDropdown');
      dropdown.length = 0;
      let defaultOption = document.createElement('option');
      defaultOption.text = 'Select Camera';
      dropdown.add(defaultOption);
      dropdown.selectedIndex = 0;
      fetch(`/api/device/list`)
        .then(response => response.json())
        .then((data) => {
          console.log(data)
          for (let i = 0; i < data.length; i++) {
            option = document.createElement('option');
            option.text = data[i].name + " (" + data[i].ip + ")";
            option.value = data[i].id;
            dropdown.add(option);
          }
          if(checkCookie("selectedCameraIndex") && checkCookie("username") && checkCookie("password")) {
            let prevSelectedIndex = getCookie("selectedCameraIndex");
            if(prevSelectedIndex <= data.length) {
              dropdown.selectedIndex = prevSelectedIndex;
              document.getElementById("username").value = getCookie("username");
              document.getElementById("password").value = getCookie("password");
            }
          }
          else {
            console.log("not found")
          }
        });
    }
    function setCamera() {
      var dropdown = document.getElementById('cameraDropdown');
      setCookie("selectedCameraIndex", dropdown.selectedIndex, 2);
    }
    // store url on load
    let currentPage = location.href;
    // listen for changes
    window.setInterval(function() {
      let currentPage = decodeURIComponent(window.location.toString())
      if(currentPage.includes('?grep=API test')) {
        let path = currentPage.split('?grep=API test')
        if(path[1].length >= 1) {
          let n = path[1].indexOf("get");
          if(n < 0) {
            n = path[1].indexOf("post");
          }
          document.getElementById('apiPath').innerHTML = `<b>Selected test: </b>${path[1].slice(n)}`;
        }
      }
      else {
        document.getElementById('apiPath').innerHTML = "";
      }
    }, 1000);
  </script>
  <div id="videoDiv" style="display:none; right: 10%; top: 17%; position: fixed; z-index: -10; border: solid 3px;">

  <script>
    function setIterations() {
      iterationsFromHtml = document.getElementById('itrerationValue').value;
      window.parent.updateIterations(iterationsFromHtml);
      let regex = /^[0-9]*$/;
      if (!iterationsFromHtml.match(regex)) {
          alert("Input must be a number !");
          return false;
      }
      let displayInfo = document.getElementById("displayInfo");
      displayInfo.style.display = "block";
      displayInfo.innerHTML = `Iterations ${iterationsFromHtml}`;
      setTimeout(function() { 
        displayInfo.style.display = "none"
      }, 2000);
    }
    // Run the tests with Mocha
    function startTest() {
      let regex = /^[0-9]+$/;
      if(iterationsFromHtml == null || !iterationsFromHtml.match(regex)) {
        alert("Please set iterations !");
        return;
      }
      document.getElementById("startTestId").style.display = "none";
      document.getElementById("resetId").style.display = "block"
      let displayInfo = document.getElementById("displayInfo");
      displayInfo.style.display = "block";
      displayInfo.innerHTML = `Starting..`;
      setTimeout(function() { 
        displayInfo.style.display = "none"
      }, 2000);
      iterationsFromHtml = document.getElementById('itrerationValue').value;
      window.parent.updateIterations(iterationsFromHtml);
      mocha.run();
    }
    function reloadPage() {
      document.location.reload();
    }
  </script>
</body>
