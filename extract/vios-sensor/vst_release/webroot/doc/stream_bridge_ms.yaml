openapi: 3.0.3
info:
  title: VST Streambridge MS
  description: |-
    VST Stream Bridge MS is used to manage UDP stream
  version: 1.0.0
  license:
    name: Copyright (c) 2021-2023, NVIDIA CORPORATION.  All rights reserved.
servers:
  - url: https://localhost/api
  - url: http://localhost/api
tags:
  - name: v1
    description: VST Streambridge API Schema v1
paths:
  /v1/streambridge/streams:
    get:
      tags:
        - v1
      summary: Get list of available streambridge streams
      operationId: getStreambridgeStream
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StreamInfoWrapper'

        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/streambridge/stream/start:
    post:
      tags:
        - v1
      summary: Start webrtc streaming
      operationId: postStreambridgeStreamStart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamStartRequest'
        required: true
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamStartResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/streambridge/stream/stop:
    post:
      tags:
        - v1
      summary: Stop webrtc streaming
      operationId: postStreambridgeStreamStop
      parameters:
        - name: streamId
          in: header
          description: The ID of the stream
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
                - peerId
                - mediaSessionId
              type: object
              properties:
                peerId:
                  type: string
                  example: '0.8595207664173294'
                mediaSessionId:
                  type: string
                  example: 'bbbbb2ea-b49a-49dc-906a-0010be31b7d7'
        required: true
      responses:
        200:
          description: Success
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/streambridge/stream/status:
    get:
      tags:
        - v1
      summary:
        Get stream error status and playback status like PLAYING, PAUSED, NOT
        PLAYING
      operationId: getStreambridgeStreamStatus
      parameters:
        - name: streamId
          in: header
          description: The ID of the stream
          required: true
          schema:
            type: string
        - name: peerId
          in: query
          required: true
          schema:
            type: string
        - name: mediaSessionId
          in: query
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamStatus'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/streambridge/setAnswer:
    post:
      tags:
        - v1
      summary: Share SDP with streambridge stream service
      operationId: postStreambridgeSetAnswer
      parameters:
        - name: peerId
          in: query
          required: true
          schema:
            type: string
        - name: streamId
          in: header
          description: The ID of the stream
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
                - sessionDescription
                - mediaSessionId
              type: object
              properties:
                sessionDescription:
                  type: string
                  example: 'v=0
                    o=mhandley 2890844526 2890842807 IN IP4 126.16.64.4
                    s=SDP Seminar
                    i=A Seminar on the session description protocol
                    c=IN IP4 224.2.17.12/127
                    t=2873397496 2873404696
                    a=recvonly
                    m=audio 49170 RTP/AVP 0
                    m=video 51372 RTP/AVP 31
                    m=application 32416 udp wb
                    a=orient:portrait'
                mediaSessionId:
                  type: string
                  example: 'bbbbb2ea-b49a-49dc-906a-0010be31b7d7'
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/streambridge/iceCandidate:
    get:
      tags:
        - v1
      summary: Get list of ICE Candidates
      operationId: getStreambridgeGetIceCandidate
      parameters:
        - name: streamId
          in: header
          description: The ID of the stream
          required: true
          schema:
            type: string
        - name: peerId
          in: query
          required: true
          schema:
            type: string
        - name: mediaSessionId
          in: query
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success array
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetIceCandidate'

        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - v1
      summary: Add new remote candidate to the RTCPeerConnection's remote description
      operationId: postStreambridgeAddIceCandidate
      parameters:
        - name: streamId
          in: header
          description: The ID of the stream
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddIceCandidate'
        required: true
      responses:
        200:
          description: Success
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/streambridge/iceServers:
    get:
      tags:
        - v1
      summary:
        Get URL or URLs of the servers to be used for ICE negotiations. These
        are typically STUN and/or TURN servers
      operationId: getStreambridgeGetIceServers
      parameters:
        - name: peerId
          in: query
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IceServersResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/streambridge/configuration:
    get:
      tags:
        - v1
      summary: Get Streambrigde service configuration
      operationId: getStreambridgeConfiguration
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetConfiguration'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - v1
      summary: Set Streambridge service configuration
      operationId: postStreambridgeConfiguration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetConfiguration'
      responses:
        200:
          description: Success
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/streambridge/version:
    get:
      tags:
        - v1
      summary: Get MS version
      operationId: getVersion
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: string
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/streambridge/help:
    get:
      tags:
        - v1
      summary: Get supported API list
      operationId: gethelp
      responses:
        200:
          description: Successs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Options:
      required:
        - rtptransport
        - streamId
        - timeout
        - quality
      type: object
      properties:
        rtptransport:
          type: string
          enum:
            - udp
            - tcp
        timeout:
          type: integer
          example: 60
        streamId:
          type: string
          example: 0b6b62ea-b49a-49dc-906a-0010be31b7d7
        quality:
          type: string
          enum: ['low', 'medium', 'high', 'auto']

    StreamStartRequest:
      required:
        - options
        - peerId
        - sessionDescription
      type: object
      properties:
        isClient:
          type: boolean
          example: true
        peerId:
          type: string
          example: '0.8595207664173294'
        options:
          $ref: '#/components/schemas/Options'
        sessionDescription:
          required:
            - sdp
            - type
          type: object
          properties:
            type:
              type: string
              example: offer
            sdp:
              type: string
              example: 'v=0
                o=mhandley 2890844526 2890842807 IN IP4 126.16.64.4
                s=SDP Seminar
                i=A Seminar on the session description protocol
                c=IN IP4 224.2.17.12/127
                t=2873397496 2873404696
                a=recvonly
                m=audio 49170 RTP/AVP 0
                m=video 51372 RTP/AVP 31
                m=application 32416 udp wb
                a=orient:portrait'

    StreamStartResponse:
      required:
        - sdp
        - type
      type: object
      properties:
        sdp:
          type: string
          example: 'v=0
            o=mhandley 2890844526 2890842807 IN IP4 126.16.64.4
            s=SDP Seminar
            i=A Seminar on the session description protocol
            c=IN IP4 224.2.17.12/127
            t=2873397496 2873404696
            a=recvonly
            m=audio 49170 RTP/AVP 0
            m=video 51372 RTP/AVP 31
            m=application 32416 udp wb
            a=orient:portrait'
        type:
          type: string
          example: answer
        mediaSessionId:
          type: string
          example: 'bbbbb2ea-b49a-49dc-906a-0010be31b7d7'

    IceServer:
      type: object
      properties:
        urls:
          type: string
      required:
        - urls

    IceServersResponse:
      type: object
      properties:
        iceServers:
          type: array
          items:
            $ref: '#/components/schemas/IceServer'
      required:
        - iceServers

    StreamStatus:
      type: object
      properties:
        error:
          type: boolean
        state:
          type: string
          enum:
            - PLAYING
            - NOT PLAYING
            - PAUSED
            - ERROR

    StreamQuery:
      type: object
      properties:
        ts:
          type: string
          example: 00:00:06.666
        metadata:
          type: object

    StreamInfoWrapper:
      type: object
      properties:
        additionalProperties:
          type: array
          items:
            $ref: '#/components/schemas/StreamInfo'

    StreamInfo:
      type: object
      properties:
        streamId:
          type: string
          example: '7927cbbc-cba6-4f22-b65d-46f7382f5f65'
        isMain:
          type: boolean
          example: true
        name:
          type: string
          example: 'HIKVISION%20DS-2CD2T43G0-I5'
        metadata:
          type: object
          properties:
            bitrate:
              type: string
              example: '8000'
            codec:
              type: string
              example: 'H264'
            framerate:
              type: string
              example: '30'
            govlength:
              type: string
              example: '60'
            resolution:
              type: string
              example: '1920x1080'

    StreamSettings:
      required:
        - framerate
        - resolution
      type: object
      properties:
        framerate:
          type: integer
        resolution:
          type: string
          example: 60

    AddIceCandidate:
      required:
        - candidate
        - peerId
      type: object
      properties:
        peerId:
          type: string
          example: 'bbbbb2ea-b49a-49dc-906a-0010be31b7d7'
        candidate:
          required:
            - candidate
            - sdpMLineIndex
            - sdpMid
          type: object
          properties:
            candidate:
              type: string
              example: candidate:878186389 1 udp 2122260223 192.168.55.1 43519
                typ host generation 0 ufrag IUnY network-id 2 network-cost
                50
            sdpMLineIndex:
              type: integer
              example: 0
            sdpMid:
              type: string
              example: '0'

    GetIceCandidate:
      type: array
      items:
        required:
          - candidate
          - sdpMLineIndex
          - sdpMid
        type: object
        properties:
          candidate:
            type: string
            example: candidate:878186389 1 udp 2122260223 192.168.55.1 43519
              typ host generation 0 ufrag IUnY network-id 2 network-cost
              50
          sdpMLineIndex:
            type: integer
            example: 0
          sdpMid:
            type: string
            example: '0'

    GetConfiguration:
      type: object
      properties:
        grpcServerPort:
          type: string
        httpPort:
          type: string
        maxDevicesSupported:
          type: integer
          minimum: 1
        maxStreamsSupported:
          type: integer
          minimum: 1
        maxWebrtcInConnections:
          type: integer
          minimum: 1
        maxWebrtcOutConnections:
          type: integer
          minimum: 1
        messageBrokerTopic:
          type: string
        enableNotification:
          type: boolean
        enableGrpc:
          type: boolean
        useMessageBroker:
          type: string
        redisServerEnvVar:
          type: string
        rtpUdpPortRange:
          type: string
        udpDropOnLatency:
          type: boolean
        udpLatencyMs:
          type: integer
          minimum: 1
        stunUrlList:
          type: array
          items:
            type: string
        useTwilioStunTurn:
          type: boolean
        twilioAccountSid:
          type: string
        twilioAuthToken:
          type: string
        enablePerfLogging:
          type: boolean
        reverseProxyServerAddress:
          type: string
        staticTurnUrlList:
          type: array
          items:
            type: string
        useCoturnAuthSecret:
          type: boolean
        useReverseProxy:
          type: boolean
        useHttpDigestAuthentication:
          type: boolean
        useHttps:
          type: boolean
        useSoftwarePath:
          type: boolean
        vstDataPath:
          type: string
        webrtcInAudioSenderMaxBitrate:
          type: integer
          minimum: 1
        webrtcInFixedResolution:
          type: string
        webrtcInMaxFramerate:
          type: integer
          minimum: 1
        webrtcInVideoBitrateThresoldPercentage:
          type: integer
          minimum: 1
          maximum: 100
        webrtcInVideoDegradationPreference:
          type: string
        webrtcInVideoSenderMaxFramerate:
          type: integer
          minimum: 1
        webrtcLatencyMs:
          type: integer
          minimum: 1
        webrtcMaxBitrate:
          type: integer
          minimum: 1
        webrtcMinBitrate:
          type: integer
          minimum: 1
        webrtcOutEnableInsertSpsPps:
          type: boolean
        webrtcOutMinDrcInterval:
          type: integer
          minimum: 1
        webrtcOutSetIdrInterval:
          type: integer
          minimum: 0
        webrtcOutSetIframeInterval:
          type: integer
          minimum: 0
        webrtcStartBitrate:
          type: integer
          minimum: 1
        webserviceAccessControlList:
          type: string
        enableGstDebugProbes:
          type: boolean
        enableUserCleanup:
          type: boolean
        multiUserExtraOptions:
          type: string
        useMultiUser:
          type: boolean
        vstIp:
          type: string
      required:
        - grpcServerPort
        - httpPort
        - maxDevicesSupported
        - maxStreamsSupported
        - maxWebrtcInConnections
        - maxWebrtcOutConnections
        - messageBrokerTopic
        - enableNotification
        - enableGrpc
        - useMessageBroker
        - redisServerEnvVar
        - rtpUdpPortRange
        - udpDropOnLatency
        - udpLatencyMs
        - stunUrlList
        - useTwilioStunTurn
        - enablePerfLogging
        - reverseProxyServerAddress
        - staticTurnUrlList
        - useCoturnAuthSecret
        - useReverseProxy
        - useHttpDigestAuthentication
        - useHttps
        - useSoftwarePath
        - vstDataPath
        - webrtcInAudioSenderMaxBitrate
        - webrtcInFixedResolution
        - webrtcInMaxFramerate
        - webrtcInVideoBitrateThresoldPercentage
        - webrtcInVideoDegradationPreference
        - webrtcInVideoSenderMaxFramerate
        - webrtcLatencyMs
        - webrtcMaxBitrate
        - webrtcMinBitrate
        - webrtcOutEnableInsertSpsPps
        - webrtcOutMinDrcInterval
        - webrtcOutSetIdrInterval
        - webrtcOutSetIframeInterval
        - webrtcStartBitrate
        - webserviceAccessControlList
        - enableGstDebugProbes
        - enableUserCleanup
        - multiUserExtraOptions
        - useMultiUser
        - vstIp

    SetConfiguration:
      type: object
      properties:
        stunUrlList:
          type: array
          items:
            type: string
        useTwilioStunTurn:
          type: boolean
        twilioAccountSid:
          type: string
        twilioAuthToken:
          type: string
        reverseProxyServerAddress:
          type: string
        staticTurnUrlList:
          type: array
          items:
            type: string
        useCoturnAuthSecret:
          type: boolean
        useReverseProxy:
          type: boolean

    Error:
      required:
        - error_code
        - error_message
      type: object
      properties:
        error_code:
          type: string
          example: VMSInternalError
        error_message:
          type: string
          example: VMS internal processing error
