    SetConfiguration:
      type: object
      properties:
        deviceDiscoveryInterfaces:
          type: array
          items:
            type: string
            example: eth0
        ntpServers:
          type: array
          items:
            type: string

    SystemStats:
      required:
        - cpuUsage
        - decUsage
        - encUsage
        - gpuUsage
        - openFilesCount
        - rssMB
        - systemMemoryUsageMB
        - totalGpuMemory
        - totalGpuMemoryUsage
      type: object
      properties:
        cpuUsage:
          type: integer
          example: 7
        decUsage:
          type: integer
          example: 13
        encUsage:
          type: integer
          example: 19
        gpuUsage:
          type: integer
          example: 1
        openFilesCount:
          type: integer
          example: 155
        rssMegabytes:
          type: integer
          example: 100
        systemMemoryUsageMegabytes:
          type: integer
          example: 433
        totalGpuMemory:
          type: integer
          example: 24576
        totalGpuMemoryUsage:
          type: integer
          example: 501
        tegraStats:
          type: object
          properties:
            total:
              type: object
              properties:
                cpu:
                  type: string
                  example: 32%@878,20%@1036,11%@1036,12%@1113,4%@1190,6%@1190,9%@1445,12%@1497
                emcFrequencyMegahertz:
                  type: string
                  example: 1%@408
                gr3dFrequencyMegahertz:
                  type: string
                  example: 0%@114
                memoryInMegabytes:
                  type: string
                  example: 982/15825

    QosStats:
      type: object
      properties:
        avgFps:
          type: number
        avgFramecount:
          type: number
        bitrateKbpsAvg:
          type: number
        bitrateKbpsMax:
          type: number
        bitrateKbpsMin:
          type: number
        elapsedMeasurementTime:
          type: number
        errors:
          type: string
        interPacketGapMsAvg:
          type: number
        interPacketGapMsMax:
          type: number
        interPacketGapMsMin:
          type: number
        name:
          type: string
        packetLossPercentageAvg:
          type: number
        packetLossPercentageMax:
          type: number
        packetLossPercentageMin:
          type: number
        rtspUrl:
          type: string
        timestamp:
          type: string
          format: date-time
        totalPacketsLost:
          type: integer
        totalPacketsReceived:
          type: integer

    Error:
      required:
        - error_code
        - error_message
      type: object
      properties:
        error_code:
          type: string
          example: VMSInternalError
        error_message:
          type: string
          example: VMS internal processing error
