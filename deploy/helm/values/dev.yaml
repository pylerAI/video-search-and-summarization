global:
  ngcImagePullSecretName: ngc-docker-reg-secret

vss:
  nodeSelector:
    kubernetes.io/hostname: dgx-b200-08
  namespace: vss-240
  storageClassName: gpfs
  applicationSpecs:
    vss-deployment:
      securityContext:
        runAsGroup: 0
        runAsUser: 0 
      containers:
        vss:
          image:
            pullPolicy: IfNotPresent
            repository: harbor.pyler.local/apps/dev/vss-engine
            tag: 46d5778af40e4b608c7463cdf2aa5d2fd91a49c4
          env:
          - name: VLM_MODEL_TO_USE
            valueFrom:
              configMapKeyRef:
                name: vss-vlm-config
                key: VLM_MODEL_TO_USE
          - name: MODEL_PATH
            valueFrom:
              configMapKeyRef:
                name: vss-vlm-config
                key: MODEL_PATH
          # - name: VIA_VLM_OPENAI_MODEL_DEPLOYMENT_NAME
          #   valueFrom:
          #     configMapKeyRef:
          #       name: vss-vlm-config
          #       key: VIA_VLM_OPENAI_MODEL_DEPLOYMENT_NAME
          # - name: VIA_VLM_ENDPOINT
          #   valueFrom:
          #     configMapKeyRef:
          #       name: vss-vlm-config
          #       key: VIA_VLM_ENDPOINT
          - name: ENABLE_AUDIO
            value: 'true'
          - name: ENABLE_RIVA_SERVER_READINESS_CHECK
            value: 'true'
          - name: LLM_MODEL
            value: openai/gpt-oss-120b
          - name: DISABLE_GUARDRAILS
            value: 'true'
          # multi-language support
          - name: RIVA_ASR_SERVER_URI
            value: riva-multilang-service.vss.svc.cluster.local
          - name: ENABLE_VIA_HEALTH_EVAL
            value: "true"
          - name: VIA_CTX_RAG_ENABLE_OTEL
            value: "true"
          - name: VIA_CTX_RAG_EXPORTER
            value: "otlp"
          - name: VIA_CTX_RAG_OTEL_ENDPOINT
            value: "http://signoz-k8s-collector-k8s-infra-otel-agent.monitoring.svc.cluster.local:4318"
          - name: VIA_ENABLE_OTEL
            value: "true"
          - name: VIA_OTEL_EXPORTER
            value: "otlp"
          - name: VIA_OTEL_ENDPOINT
            value: "http://signoz-k8s-collector-k8s-infra-otel-agent.monitoring.svc.cluster.local:4318"
          startupProbe:
            failureThreshold: 360
      initContainers:
      - command:
        - sh
        - -c
        - until nc -z -w 2 milvus-milvus-deployment-milvus-service 19530; do echo
          waiting for milvus; sleep 2; done
        image: busybox:1.28
        imagePullPolicy: IfNotPresent
        name: check-milvus-up
      - command:
        - sh
        - -c
        - until nc -z -w 2 neo-4-j-service 7687; do echo waiting for neo4j; sleep
          2; done
        image: busybox:1.28
        imagePullPolicy: IfNotPresent
        name: check-neo4j-up
      - args:
        - "while ! curl -s -f -o /dev/null http://llm-openai-svc.vss.svc.cluster.local:8000/v1/health/live;\
          \ do\n  echo \"Waiting for LLM...\"\n  sleep 2\ndone\n"
        command:
        - sh
        - -c
        image: curlimages/curl:latest
        name: check-llm-up

  configs:
    ca_rag_config.yaml:
      tools:
        chat_llm:
          params:
            base_url: http://llm-openai-svc.vss.svc.cluster.local:8000/v1
        notification_llm:
          params:
            base_url: http://llm-openai-svc.vss.svc.cluster.local:8000/v1
        nvidia_embedding:
          params:
            base_url: http://nemo-embedding-embedding-deployment-embedding-service.vss.svc.cluster.local:8000/v1
        nvidia_reranker:
          params:
            base_url: http://nemo-rerank-ranking-deployment-ranking-service.vss.svc.cluster.local:8000/v1
        summarization_llm:
          params:
            base_url: http://llm-openai-svc.vss.svc.cluster.local:8000/v1
    guardrails_config.yaml:
      models:
      - engine: nim
        model: openai/gpt-oss-120b
        parameters:
          base_url: http://llm-openai-svc.vss.svc.cluster.local:8000/v1
        type: main
      - engine: nim
        model: nvidia/llama-3.2-nv-embedqa-1b-v2
        parameters:
          base_url: http://nemo-embedding-embedding-deployment-embedding-service.vss.svc.cluster.local:8000/v1
        type: embeddings
  egress:
    # multi-language support
    riva-api:
      address: riva-multilang-service.vss.svc.cluster.local
      port: 9000
    llm-openai-api:
      address: llm-openai-svc.vss.svc.cluster.local
      port: 8000

  resources:
    limits:
      nvidia.com/gpu: 2
  workloadSpecs:
    wl-env:
      wl_env:
      - name: FRONTEND_PORT
        value: '9000'
      - name: BACKEND_PORT
        value: '8000'
      - name: GRAPH_DB_HOST
        value: neo-4-j-service
      - name: GRAPH_DB_PORT
        value: '7687'
      - name: MILVUS_DB_HOST
        value: milvus-milvus-deployment-milvus-service
      - name: MILVUS_DB_PORT
        value: '19530'
      - name: MINIO_HOST
        value: minio-minio-deployment-minio-service
      - name: MINIO_PORT
        value: '9000'
      - name: MINIO_WEBUI_PORT
        value: '9001'
      - name: ARANGO_DB_HOST
        value: arango-db-arango-db-deployment-arango-db-service
      - name: ARANGO_DB_PORT
        value: '8529'
      - name: APP_VECTORSTORE_URL
        value: http://milvus-milvus-deployment-milvus-service:19530
      - name: OPENAI_API_KEY
        valueFrom:
          secretKeyRef:
            key: OPENAI_API_KEY
            name: infisical-managed-secrets
            optional: true
      - name: NGC_API_KEY
        valueFrom:
          secretKeyRef:
            key: NGC_API_KEY
            name: infisical-managed-secrets
      - name: NVIDIA_API_KEY
        valueFrom:
          secretKeyRef:
            key: NGC_API_KEY
            name: infisical-managed-secrets
      - name: GRAPH_DB_USERNAME
        valueFrom:
          secretKeyRef:
            key: GRAPHDB_USER
            name: infisical-managed-secrets
      - name: GRAPH_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            key: GRAPHDB_PASSWORD
            name: infisical-managed-secrets
      - name: MINIO_USERNAME
        valueFrom:
          secretKeyRef:
            key: MINIO_USERNAME
            name: infisical-managed-secrets
      - name: MINIO_PASSWORD
        valueFrom:
          secretKeyRef:
            key: MINIO_PASSWORD
            name: infisical-managed-secrets
      - name: ARANGO_DB_USERNAME
        valueFrom:
          secretKeyRef:
            key: ARANGO_DB_USERNAME
            name: infisical-managed-secrets
      - name: ARANGO_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            key: ARANGO_DB_PASSWORD
            name: infisical-managed-secrets
      - name: ES_HOST
        value: elasticsearch-elasticsearch-deployment-elasticsearch-service
      - name: ES_PORT
        value: '9200'
      - name: ES_TRANSPORT_PORT
        value: '9300'


etcd:
  nodeSelector: 
    pyler.io/group: dgx
  namespace: vss-240
  storageClassName: gpfs

minio:
  nodeSelector: 
    pyler.io/group: dgx
  namespace: vss-240  
  storageClassName: gpfs
  applicationSpecs:
    minio-deployment:
      containers:
        minio-container:
          env:
          - name: MINIO_ROOT_USER
            valueFrom:
              secretKeyRef:
                key: MINIO_USERNAME
                name: infisical-managed-secrets
          - name: MINIO_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                key: MINIO_PASSWORD
                name: infisical-managed-secrets
  extraPodVolumes:
  - name: secret-access-key-volume
    secret:
      secretName: infisical-managed-secrets
      items:
      - key: MINIO_USERNAME
        path: access-key
  - name: secret-secret-key-volume
    secret:
      secretName: infisical-managed-secrets
      items:
      - key: MINIO_PASSWORD
        path: secret-key
  extraPodVolumeMounts:
  - name: secret-access-key-volume
    mountPath: /secrets/access-key
    subPath: access-key
    readOnly: true
  - name: secret-secret-key-volume
    mountPath: /secrets/secret-key
    subPath: secret-key
    readOnly: true

milvus:
  nodeSelector: 
    pyler.io/group: dgx
  namespace: vss-240  
  storageClassName: gpfs

neo4j:
  nodeSelector: 
    pyler.io/group: dgx
  namespace: vss-240  
  storageClassName: gpfs

  extraPodVolumes:
  - name: secret-db-username-volume
    secret:
      secretName: infisical-managed-secrets
      items:
      - key: GRAPHDB_USER
        path: db-username
  - name: secret-db-password-volume
    secret:
      secretName: infisical-managed-secrets
      items:
      - key: GRAPHDB_PASSWORD
        path: db-password
  extraPodVolumeMounts:
  - name: secret-db-username-volume
    mountPath: /secrets/db-username
    subPath: db-username
    readOnly: true
  - name: secret-db-password-volume
    mountPath: /secrets/db-password
    subPath: db-password
    readOnly: true

