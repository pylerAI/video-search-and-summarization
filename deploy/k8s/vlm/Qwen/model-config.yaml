apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen-model-config
  namespace: vss
  labels:
    app: qwen-server
data:
  # Qwen 모델 설정
  MODEL_NAME: "Qwen/Qwen2.5-VL-32B-Instruct"
  TRUST_REMOTE_CODE: "true"
  PORT: "8000"
  HOST: "0.0.0.0"
  
  # VLLM 설정
  VLLM_TENSOR_PARALLEL_SIZE: "2"
  GPU_MEMORY_UTILIZATION: "0.9"
  MAX_MODEL_LEN: "24000"
  
  # VIA 연동 설정
  VIA_VLM_OPENAI_MODEL_DEPLOYMENT_NAME: "Qwen2.5-VL-32B-Instruct"
  VLM_MODEL_TO_USE: "openai-compat"
  VIA_VLM_ENDPOINT: "http://qwen-server-service:8000"
  OPENAI_API_KEY: "fake_key"
  
  # NGC 캐시 설정
  NGC_MODEL_CACHE: "/tmp/via-ngc-model-cache"
  HF_HOME: "/tmp/via-ngc-model-cache/huggingface"
  TRANSFORMERS_CACHE: "/tmp/via-ngc-model-cache/transformers"
