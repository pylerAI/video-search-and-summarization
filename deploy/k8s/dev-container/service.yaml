apiVersion: v1
kind: Service
metadata:
  name: vss-service-dev-container
  namespace: vss
spec:
  ports:
  - name: http-api
    nodePort: 31635
    port: 8000
    protocol: TCP
    targetPort: 8000
  - name: webui
    nodePort: 30935
    port: 9000
    protocol: TCP
    targetPort: 9000
  - name: ssh
    nodePort: 32335
    port: 2222
    protocol: TCP
    targetPort: 2222
  selector:
    app: vss-vss-deployment-dev-container
  sessionAffinity: None
  type: NodePort