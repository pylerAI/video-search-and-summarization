name: VSS Script Config Update

on:
  push:
    branches:
      - develop-2.4.0
    paths:
      - 'deploy/k8s/dev/vss-configs-cm.yaml'

  workflow_call:
    inputs:
      config_only:
        required: false
        type: boolean
        default: false
    secrets:
      TOKEN:
        required: false
      SSH_PRIVATE_KEY:
        required: false

jobs:
  update-config-and-restart:
    runs-on: sel2-arc-runners
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.3'

      - name: Update VSS VLM ConfigMap
        run: |
          echo "=== VSS Script ConfigMap 업데이트 ==="
          kubectl apply -f deploy/k8s/dev/vss-configs-cm.yaml
          
          echo "=== 현재 VSS Script ConfigMap 상태 ==="
          kubectl get configmap vss-configs-cm -n vss -o yaml

      - name: Restart VSS deployment
        run: |
          # Wait for deployment to be ready
          kubectl rollout restart deployment/vss-vss-deployment -n vss
      
      - name: Verify deployment
        run: |
          echo "=== VSS 서비스 상태 ==="
          kubectl get pods -n vss
          kubectl get svc -n vss
          
          echo "=== VSS VLM ConfigMap 내용 확인 ==="
          kubectl get configmap vss-configs-cm -n vss -o yaml
