include:
  - path: $MDX_SAMPLE_APPS_DIR/vst/developer/vst/sdr-replaystream-http/sdr-compose.yaml

services:
  centralizedb-dev:
    image: ${POSTGRES_IMAGE}
    profiles: ["bp_developer_base_2d","bp_developer_search_2d","bp_developer_lvs_2d"]
    user: "0:0"
    environment:
      - POSTGRES_USER=${CENTRALIZE_DB_USERNAME}
      - POSTGRES_DB=${CENTRALIZE_DB_NAME}
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - ${VST_VOLUME}/postgres/db:/var/lib/postgresql/data
      - ${VST_CONFIG_PATH}/postgresql.conf:/etc/postgresql/postgresql.conf
      - ${VST_DATA_PATH}:/var/run/postgresql
    network_mode: host
    container_name: centralizedb-dev
    restart: always
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
      - "-c"
      - "unix_socket_directories=/var/run/postgresql"

  vst-ingress-dev:
    image: ${NGINX_IMAGE}
    profiles: ["bp_developer_base_2d","bp_developer_search_2d","bp_developer_lvs_2d"]
    user: "0:0"
    environment:
      - HOST_IP=${HOST_IP}
      - EXTERNALLY_ACCESSIBLE_IP=${EXTERNALLY_ACCESSIBLE_IP}
    volumes:
      - ${VST_CONFIG_PATH}/nginx-${NGINX_MODE:-vst}.conf.template:/etc/nginx/nginx.conf.template:ro
      - ${VST_CONFIG_PATH}/nginx-${NGINX_MODE:-vst}.conf:/etc/nginx/nginx.conf
      - ${VST_LOGS}/nginx_logs:/var/log/nginx
    network_mode: host
    container_name: vst-ingress-dev
    restart: always    # Nginx should always restart as it's critical for routing
    command:
      - /bin/sh
      - -c
      - |
        sed 's/__INTERNAL_IP__/${HOST_IP}/g; s/__EXTERNAL_IP__/${EXTERNALLY_ACCESSIBLE_IP}/g' /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
        exec nginx -g 'daemon off;'

  sensor-ms-dev:
    image: ${VST_SENSOR_IMAGE}
    profiles: ["bp_developer_base_2d","bp_developer_search_2d","bp_developer_lvs_2d"]
    user: "0:0"
    runtime: nvidia
    entrypoint: ["/bin/bash", "-c", "exec /home/vst/vst_release/launch_vst"]
    environment:
      - ADAPTOR=${VST_ADAPTOR}
      - NEED_RECORDING=false
      - NEED_RTSPSERVER=false
      - NEED_STORAGE=false
      - NEED_STREAM_MONITORING=true
      - HTTP_PORT=${SENSOR_HTTP_PORT}
      - CENTRALIZE_DB_NAME=${CENTRALIZE_DB_NAME}
      - CENTRALIZE_DB_USERNAME=${CENTRALIZE_DB_USERNAME}
      - RTSP_SERVER_MODULE_ENDPOINT=${RTSP_SERVER_MODULE_ENDPOINT}
      - RECORDER_MODULE_ENDPOINT=${RECORDER_MODULE_ENDPOINT}
      - STORAGE_MODULE_ENDPOINT=${STORAGE_MODULE_ENDPOINT}
    volumes:
      - ${VST_CONFIG_PATH}:/home/vst/vst_release/configs
      - ${VST_CONFIG_PATH}/vst_config_${STREAM_TYPE:-redis}.json:/home/vst/vst_release/configs/vst_config.json
      - ${VST_DATA_PATH}:/home/vst/vst_release/vst_data
      - ${VST_VIDEO_STORAGE_PATH}:/home/vst/vst_release/vst_video
    network_mode: host
    container_name: sensor-ms-dev
    restart: on-failure    # Restart only if the container exits with non-zero status
    depends_on:
      redis:
        condition: service_started
      vst-ingress-dev:
        condition: service_started
      centralizedb-dev:
        condition: service_started

  storage-ms-dev:
    image: ${VST_STORAGE_IMAGE}
    profiles: ["bp_developer_base_2d","bp_developer_search_2d","bp_developer_lvs_2d"]
    user: "0:0"
    runtime: nvidia
    entrypoint: ["/bin/bash", "-c", "if [ \"$VST_INSTALL_ADDITIONAL_PACKAGES\" = \"true\" ]; then /home/vst/vst_release/tools/user_additional_install.sh; fi && exec /home/vst/vst_release/launch_vst"]
    environment:
      - VST_INSTALL_ADDITIONAL_PACKAGES=${VST_INSTALL_ADDITIONAL_PACKAGES}  # Set to true when needed
      - NVIDIA_VISIBLE_DEVICES=all
      - ADAPTOR=${VST_ADAPTOR}
      - NEED_RECORDING=false
      - NEED_RTSPSERVER=false
      - NEED_STORAGE=true
      - NEED_STREAM_MONITORING=false
      - HTTP_PORT=${STORAGE_HTTP_PORT}
      - CENTRALIZE_DB_NAME=${CENTRALIZE_DB_NAME}
      - CENTRALIZE_DB_USERNAME=${CENTRALIZE_DB_USERNAME}
      - VST_INGRESS_ENDPOINT=${VST_INGRESS_ENDPOINT}
    volumes:
      - ${VST_CONFIG_PATH}:/home/vst/vst_release/configs
      - ${VST_CONFIG_PATH}/vst_config_${STREAM_TYPE:-redis}.json:/home/vst/vst_release/configs/vst_config.json
      - ${VST_DATA_PATH}:/home/vst/vst_release/vst_data
      - ${VST_VIDEO_STORAGE_PATH}:/home/vst/vst_release/vst_video
      - ${CLIP_STORAGE_PATH}:/home/vst/vst_release/streamer_videos
      - ${VST_TEMP_FILES_PATH}:/home/vst/vst_release/webroot/temp_files
      - ${MDX_SAMPLE_APPS_DIR}/vst/scripts/user_additional_install.sh:/home/vst/vst_release/tools/user_additional_install.sh
    network_mode: host
    container_name: storage-ms-dev
    restart: on-failure    # Restart only if the container exits with non-zero status
    depends_on:
      redis:
        condition: service_started
      vst-ingress-dev:
        condition: service_started
      centralizedb-dev:
        condition: service_started

  vst-mcp-dev:
    image: ${VST_MCP_IMAGE}
    profiles: ["bp_developer_base_2d","bp_developer_search_2d","bp_developer_lvs_2d"]
    user: "0:0"
    environment:
      - MCP_GATEWAY_CPP_API_BASE_URL=${MCP_GATEWAY_CPP_API_BASE_URL}
      - MCP_GATEWAY_CPP_API_TIMEOUT=${MCP_GATEWAY_CPP_API_TIMEOUT}
      - MCP_GATEWAY_SERVER_NAME=${MCP_GATEWAY_SERVER_NAME}
      - MCP_GATEWAY_SERVER_VERSION=${MCP_GATEWAY_SERVER_VERSION}
      - MCP_GATEWAY_SERVER_HOST=${MCP_GATEWAY_SERVER_HOST}
      - MCP_GATEWAY_SERVER_PORT=${MCP_GATEWAY_SERVER_PORT}
      - MCP_GATEWAY_LOG_LEVEL=${MCP_GATEWAY_LOG_LEVEL}
      - MCP_GATEWAY_ENABLE_JSONRPC_LOGGING=${MCP_GATEWAY_ENABLE_JSONRPC_LOGGING}
    network_mode: host
    container_name: vst-mcp-dev
    restart: always
    depends_on:
      sensor-ms-dev:
        condition: service_started
      vst-ingress-dev:
        condition: service_started
      centralizedb-dev:
        condition: service_started
