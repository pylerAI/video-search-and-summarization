services:
  nvidia-nemotron-nano-9b-v2:
    image: nvcr.io/nim/nvidia/nvidia-nemotron-nano-9b-v2:latest
    container_name: nvidia-nemotron-nano-9b-v2
    profiles:
    - llm_local_nvidia-nemotron-nano-9b-v2_H100
    - llm_local_nvidia-nemotron-nano-9b-v2_L40S
    - llm_local_nvidia-nemotron-nano-9b-v2_A6000
    - llm_local_nvidia-nemotron-nano-9b-v2_RTX6000PROBW
    - llm_local_nvidia-nemotron-nano-9b-v2_DGX-THOR
    - llm_local_nvidia-nemotron-nano-9b-v2_DGX-SPARK
    runtime: nvidia
    shm_size: 16GB
    ports:
     - ${LLM_PORT:-30081}:8000
    environment:
      NGC_API_KEY: "${NGC_CLI_API_KEY}"
      PYTORCH_CUDA_ALLOC_CONF: 'expandable_segments:True'
    env_file:
      - ${MDX_SAMPLE_APPS_DIR}/nim/nemotron-nano-v2/hw-${HARDWARE_PROFILE}.env
    volumes:
      - nvidia_nemotron_nano_9b_v2_cache:/opt/nim/.cache
    user: "${UID:-1000}:${GID:-1000}"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
              - gpu
              driver: nvidia
              device_ids:
              - "${LLM_DEVICE_ID:-1}"
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'if [ -f /tmp/ready_done ]; then curl --max-time 30 -f http://localhost:8000/v1/health/live; else elapsed=0; while ! curl -fs http://localhost:8000/v1/health/ready > /dev/null 2>&1; do sleep 5; echo "elapsed $elapsed"; elapsed=$((elapsed + 5)); if [ $elapsed -ge 600 ]; then echo "Service did not become ready within 10 minutes"; exit 1; fi; done; touch /tmp/ready_done && curl --max-time 30 -f http://localhost:8000/v1/health/live; fi']
      interval: 60s
      timeout: 650s
      retries: 2
  nvidia-nemotron-nano-9b-v2-shared-gpu:
    image: nvcr.io/nim/nvidia/nvidia-nemotron-nano-9b-v2:latest
    container_name: nvidia-nemotron-nano-9b-v2-shared-gpu
    profiles:
    - llm_local_shared_nvidia-nemotron-nano-9b-v2_H100
    - llm_local_shared_nvidia-nemotron-nano-9b-v2_L40S
    - llm_local_shared_nvidia-nemotron-nano-9b-v2_A6000
    - llm_local_shared_nvidia-nemotron-nano-9b-v2_RTX6000PROBW
    - llm_local_shared_nvidia-nemotron-nano-9b-v2_DGX-THOR
    - llm_local_shared_nvidia-nemotron-nano-9b-v2_DGX-SPARK
    runtime: nvidia
    shm_size: 16GB
    ports:
     - ${LLM_PORT:-30081}:8000
    environment:
      NGC_API_KEY: "${NGC_CLI_API_KEY}"
      PYTORCH_CUDA_ALLOC_CONF: 'expandable_segments:True'
    env_file:
      - ${MDX_SAMPLE_APPS_DIR}/nim/nemotron-nano-v2/hw-${HARDWARE_PROFILE}-full.env
    volumes:
      - nvidia_nemotron_nano_9b_v2_cache:/opt/nim/.cache
    user: "${UID:-1000}:${GID:-1000}"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
              - gpu
              driver: nvidia
              device_ids:
              - "${LLM_DEVICE_ID:-1}"
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'if [ -f /tmp/ready_done ]; then curl --max-time 30 -f http://localhost:8000/v1/health/live; else elapsed=0; while ! curl -fs http://localhost:8000/v1/health/ready > /dev/null 2>&1; do sleep 5; echo "elapsed $elapsed"; elapsed=$((elapsed + 5)); if [ $elapsed -ge 600 ]; then echo "Service did not become ready within 10 minutes"; exit 1; fi; done; touch /tmp/ready_done && curl --max-time 30 -f http://localhost:8000/v1/health/live; fi']
      interval: 60s
      timeout: 650s
      retries: 2
    depends_on:
      cosmos-reason2-8b-shared-gpu:
        condition: service_healthy
        required: false
      cosmos-reason1-7b-shared-gpu:
        condition: service_healthy
        required: false
      qwen3-vl-8b-instruct-shared-gpu:
        condition: service_healthy
        required: false
volumes:
  nvidia_nemotron_nano_9b_v2_cache: