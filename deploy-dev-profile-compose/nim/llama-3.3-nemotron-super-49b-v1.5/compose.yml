services:
  llama-3.3-nemotron-super-49b-v1.5:
    image: nvcr.io/nim/nvidia/llama-3.3-nemotron-super-49b-v1.5:latest
    container_name: llama-3.3-nemotron-super-49b-v1.5
    profiles:
    - llm_local_llama-3.3-nemotron-super-49b-v1.5_H100
    - llm_local_llama-3.3-nemotron-super-49b-v1.5_RTX6000PROBW
    runtime: nvidia
    shm_size: 16GB
    ports:
     - ${LLM_PORT:-30081}:8000
    environment:
      NGC_API_KEY: "${NGC_CLI_API_KEY}"
    env_file:
      - ${MDX_SAMPLE_APPS_DIR}/nim/llama-3.3-nemotron-super-49b-v1.5/hw-${HARDWARE_PROFILE}.env
    volumes:
      - llama_3.3_nemotron_super_49b_v1.5_cache:/opt/nim/.cache
    user: "${UID:-1000}:${GID:-1000}"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
              - gpu
              driver: nvidia
              device_ids:
              - "${LLM_DEVICE_ID:-1}"
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'if [ -f /tmp/ready_done ]; then curl --max-time 30 -f http://localhost:8000/v1/health/live; else elapsed=0; while ! curl -fs http://localhost:8000/v1/health/ready > /dev/null 2>&1; do sleep 5; echo "elapsed $elapsed"; elapsed=$((elapsed + 5)); if [ $elapsed -ge 600 ]; then echo "Service did not become ready within 10 minutes"; exit 1; fi; done; touch /tmp/ready_done && curl --max-time 30 -f http://localhost:8000/v1/health/live; fi']
      interval: 60s
      timeout: 650s
      retries: 2
  llama-3.3-nemotron-super-49b-v1.5-shared-gpu:
    image: nvcr.io/nim/nvidia/llama-3.3-nemotron-super-49b-v1.5:latest
    container_name: llama-3.3-nemotron-super-49b-v1.5-shared-gpu
    profiles:
    - llm_local_shared_llama-3.3-nemotron-super-49b-v1.5_H100
    - llm_local_shared_llama-3.3-nemotron-super-49b-v1.5_RTX6000PROBW
    runtime: nvidia
    shm_size: 16GB
    ports:
     - ${LLM_PORT:-30081}:8000
    environment:
      NGC_API_KEY: "${NGC_CLI_API_KEY}"
    env_file:
      - ${MDX_SAMPLE_APPS_DIR}/nim/llama-3.3-nemotron-super-49b-v1.5/hw-${HARDWARE_PROFILE}-full.env
    volumes:
      - llama_3.3_nemotron_super_49b_v1.5_cache:/opt/nim/.cache
    user: "${UID:-1000}:${GID:-1000}"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
              - gpu
              driver: nvidia
              device_ids:
              - "${LLM_DEVICE_ID:-1}"
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'if [ -f /tmp/ready_done ]; then curl --max-time 30 -f http://localhost:8000/v1/health/live; else elapsed=0; while ! curl -fs http://localhost:8000/v1/health/ready > /dev/null 2>&1; do sleep 5; echo "elapsed $elapsed"; elapsed=$((elapsed + 5)); if [ $elapsed -ge 600 ]; then echo "Service did not become ready within 10 minutes"; exit 1; fi; done; touch /tmp/ready_done && curl --max-time 30 -f http://localhost:8000/v1/health/live; fi']
      interval: 60s
      timeout: 650s
      retries: 2
volumes:
  llama_3.3_nemotron_super_49b_v1.5_cache: