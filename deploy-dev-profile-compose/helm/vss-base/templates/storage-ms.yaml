{{- if .Values.storageMs.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vss-base.fullname" . }}-storage-ms
  labels:
    {{- include "vss-base.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: storage-ms
  template:
    metadata:
      labels:
        app.kubernetes.io/component: storage-ms
    spec:
      {{- include "vss-base.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.storageMs.runtimeClassName }}
      runtimeClassName: {{ .Values.storageMs.runtimeClassName }}
      {{- end }}
      containers:
        - name: storage-ms
          image: "{{ .Values.storageMs.image.repository }}:{{ .Values.storageMs.image.tag }}"
          imagePullPolicy: {{ .Values.storageMs.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.storageMs.port }}
              name: http
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: ADAPTOR
              valueFrom:
                configMapKeyRef:
                  name: {{ include "vss-base.fullname" . }}-config
                  key: VST_ADAPTOR
            - name: HTTP_PORT
              value: {{ .Values.storageMs.port | quote }}
            - name: SENSOR_MODULE_ENDPOINT
              value: "http://{{ include "vss-base.fullname" . }}-sensor-ms:{{ .Values.sensorMs.port }}"
            - name: REDIS_HOSTADDR
              value: "{{ include "vss-base.fullname" . }}-redis"
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: REDIS_MSG_KEY
              value: "vst.event"
            - name: VST_INSTALL_ADDITIONAL_PACKAGES
              value: "true"
          volumeMounts:
            - name: vst-data
              mountPath: /home/vst/vst_release/vst_data
            - name: vst-video
              mountPath: /home/vst/vst_release/vst_video
            - name: vst-clips
              mountPath: /home/vst/vst_release/streamer_videos
            - name: vst-temp
              mountPath: /home/vst/vst_release/webroot/temp_files
          {{- with .Values.storageMs.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: vst-data
          {{- if .Values.vstSharedVolumes.vstData.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "vss-base.fullname" . }}-vst-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: vst-video
          {{- if .Values.vstSharedVolumes.vstVideo.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "vss-base.fullname" . }}-vst-video
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: vst-clips
          {{- if .Values.vstSharedVolumes.vstClips.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "vss-base.fullname" . }}-vst-clips
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: vst-temp
          {{- if .Values.vstSharedVolumes.vstTemp.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "vss-base.fullname" . }}-vst-temp
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vss-base.fullname" . }}-storage-ms
  labels:
    {{- include "vss-base.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-ms
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.storageMs.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: storage-ms
{{- end }}
