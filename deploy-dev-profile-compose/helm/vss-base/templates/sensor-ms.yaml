{{- if .Values.sensorMs.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vss-base.fullname" . }}-sensor-ms
  labels:
    {{- include "vss-base.labels" . | nindent 4 }}
    app.kubernetes.io/component: sensor-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: sensor-ms
  template:
    metadata:
      labels:
        app.kubernetes.io/component: sensor-ms
    spec:
      {{- include "vss-base.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.sensorMs.runtimeClassName }}
      runtimeClassName: {{ .Values.sensorMs.runtimeClassName }}
      {{- end }}
      containers:
        - name: sensor-ms
          image: "{{ .Values.sensorMs.image.repository }}:{{ .Values.sensorMs.image.tag }}"
          imagePullPolicy: {{ .Values.sensorMs.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.sensorMs.port }}
              name: http
          env:
            - name: ADAPTOR
              valueFrom:
                configMapKeyRef:
                  name: {{ include "vss-base.fullname" . }}-config
                  key: VST_ADAPTOR
            - name: HTTP_PORT
              value: {{ .Values.sensorMs.port | quote }}
            - name: STORAGE_MS_HTTP_PORT
              value: {{ .Values.storageMs.port | quote }}
            - name: STORAGE_MODULE_ENDPOINT
              value: "http://{{ include "vss-base.fullname" . }}-storage-ms:{{ .Values.storageMs.port }}"
            - name: RTSP_SERVER_MODULE_ENDPOINT
              value: "http://localhost:10000"
            - name: RECORDER_MODULE_ENDPOINT
              value: "http://localhost:10001"
            - name: REPLAYSTREAM_MODULE_ENDPOINT
              value: "http://localhost:10002"
            - name: LIVESTREAM_MODULE_ENDPOINT
              value: "http://localhost:10003"
            - name: REDIS_HOSTADDR
              value: "{{ include "vss-base.fullname" . }}-redis"
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: REDIS_MSG_KEY
              value: "vst.event"
          volumeMounts:
            - name: vst-data
              mountPath: /home/vst/vst_release/vst_data
            - name: vst-video
              mountPath: /home/vst/vst_release/vst_video
          {{- with .Values.sensorMs.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: vst-data
          {{- if .Values.vstSharedVolumes.vstData.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "vss-base.fullname" . }}-vst-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: vst-video
          {{- if .Values.vstSharedVolumes.vstVideo.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "vss-base.fullname" . }}-vst-video
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vss-base.fullname" . }}-sensor-ms
  labels:
    {{- include "vss-base.labels" . | nindent 4 }}
    app.kubernetes.io/component: sensor-ms
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.sensorMs.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: sensor-ms
{{- end }}
