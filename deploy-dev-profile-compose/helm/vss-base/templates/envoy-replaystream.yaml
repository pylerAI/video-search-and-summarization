{{- if .Values.envoyReplaystream.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vss-base.fullname" . }}-envoy-replaystream
  labels:
    {{- include "vss-base.labels" . | nindent 4 }}
    {{- include "vss-base.selectorLabels" (dict "component" "envoy-replaystream" "root" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "vss-base.selectorLabels" (dict "component" "envoy-replaystream" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vss-base.labels" . | nindent 8 }}
        {{- include "vss-base.selectorLabels" (dict "component" "envoy-replaystream" "root" .) | nindent 8 }}
    spec:
      {{- include "vss-base.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: envoy-replaystream
          image: "{{ .Values.envoyReplaystream.image.repository }}:{{ .Values.envoyReplaystream.image.tag }}"
          imagePullPolicy: {{ .Values.envoyReplaystream.image.pullPolicy }}
          command:
            - /usr/local/bin/envoy
            - -c
            - /etc/envoy/envoy.yaml
            - --concurrency
            - "16"
          ports:
            - containerPort: 10000
              name: envoy
          env:
            - name: WDM_WL_REDIS_SERVER
              value: {{ include "vss-base.fullname" . }}-redis
            - name: WDM_WL_REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: WDM_WL_OBJECT_NAME
              value: "replaystream-ms"
            - name: ENVOYROUTEHEADER
              value: "streamid"
            - name: NOHEADERTARGETCONTAINER
              value: "replaystream-01"
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
      volumes:
        - name: envoy-config
          configMap:
            name: {{ include "vss-base.fullname" . }}-envoy-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vss-base.fullname" . }}-envoy-replaystream
  labels:
    {{- include "vss-base.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 10000
      targetPort: envoy
      protocol: TCP
      name: envoy
  selector:
    {{- include "vss-base.selectorLabels" (dict "component" "envoy-replaystream" "root" .) | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vss-base.fullname" . }}-envoy-config
  labels:
    {{- include "vss-base.labels" . | nindent 4 }}
data:
  envoy.yaml: |
    # Envoy proxy configuration for replaystream routing
    # NOTE: This is a placeholder. Mount your actual envoy.yaml config here.
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901
    static_resources:
      listeners:
        - name: listener_0
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 10000
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: service
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/"
                              route:
                                cluster: replaystream_cluster
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: replaystream_cluster
          connect_timeout: 30s
          type: STRICT_DNS
          load_assignment:
            cluster_name: replaystream_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ include "vss-base.fullname" . }}-replaystream-ms
                          port_value: {{ .Values.replaystreamMs.port }}
{{- end }}
