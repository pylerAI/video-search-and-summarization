apiVersion: apps/v1
kind: Deployment
metadata:
  name: vila-server
  namespace: vss
  labels:
    app: vila-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vila-server
  template:
    metadata:
      labels:
        app: vila-server
    spec:
      # 보안 설정
      securityContext:
        fsGroup: 1000
      containers:
      - name: vila-server
        image: harbor.pyler.local/apps/vila-server:IMAGE_TAG
        ports:
        - containerPort: 8000
        env:
        - name: VILA_MODEL_PATH
          value: "Efficient-Large-Model/VILA1.5-40B"
        - name: VILA_CONV_MODE
          value: "hermes-2"
        - name: VILA_HOST
          value: "0.0.0.0"
        - name: VILA_PORT
          value: "8000"
        - name: VILA_WORKERS
          value: "1"


        # NGC 캐시 설정
        - name: NGC_MODEL_CACHE
          value: /tmp/via-ngc-model-cache
        - name: HF_HOME
          value: /tmp/via-ngc-model-cache/huggingface
        - name: TRANSFORMERS_CACHE
          value: /tmp/via-ngc-model-cache/transformers

        # VIA와 연동을 위한 설정
        - name: VIA_VLM_OPENAI_MODEL_DEPLOYMENT_NAME
          value: "VILA1.5-40b"
        - name: VLM_MODEL_TO_USE
          value: "openai-compat"
        - name: VIA_VLM_ENDPOINT
          value: "http://vila-server-service:8000"
        - name: OPENAI_API_KEY
          value: "fake_key"
        - name: NVIDIA_API_KEY
          valueFrom:
            secretKeyRef:
              key: NGC_API_KEY
              name: infisical-managed-secrets

        resources:
          requests:
            nvidia.com/gpu: "2"
          limits:
            nvidia.com/gpu: "2"

        volumeMounts:
        - mountPath: /tmp/via-ngc-model-cache
          name: ngc-model-cache-volume
        - mountPath: /dev/shm
          name: shm-volume
      volumes:
      - name: ngc-model-cache-volume
        persistentVolumeClaim:
          claimName: vila-ngc-model-cache-pvc
      - emptyDir:
          medium: Memory
          sizeLimit: 16Gi
        name: shm-volume

      nodeSelector:
        pyler.io/group: dgx