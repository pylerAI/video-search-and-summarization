# VLM Models Configuration
# This file defines external OpenAI-compatible VLM models that can be used by VSS
# All models should follow the OpenAI API specification

vlm_models:
  # OpenAI GPT-4o
  gpt-4o:
    type: "openai-compat"
    api_key_env: "OPENAI_API_KEY"  # Environment variable containing the API key
    endpoint: "https://api.openai.com/v1/"
    deployment_name: "gpt-4o"
    enabled: true
    description: "OpenAI GPT-4o model with vision capabilities"

  gpt-4o-mini:
    type: "openai-compat"
    api_key_env: "OPENAI_API_KEY"  # Environment variable containing the API key
    endpoint: "https://api.openai.com/v1/"
    deployment_name: "gpt-4o-mini"  # Valid OpenAI model name
    enabled: true
    description: "OpenAI GPT-4o model with vision capabilities (mapped from gpt-4o-mini)"


  # Local/On-premise OpenAI-compatible endpoint (cosmos-reason-1-7b)
  cosmos-reason-1-7b:
    type: "openai-compat"
    api_key_env: "LOCAL_VLM_API_KEY"  # Can be a dummy key for local deployments
    endpoint: "http://ray-cluster-worker-serve-svc.ray-cluster.idc.k8s:8000/svc-vss/v1/"
    deployment_name: "cosmos-reason-1-7b"  # Updated to match run_240.sh
    enabled: true  # Enabled for Phase 3A testing
    description: "Local on-premise Cosmos Reason1-7B model with OpenAI-compatible API"

# Global settings for all OpenAI-compatible models
global_settings:
  timeout: 30  # Request timeout in seconds
  max_retries: 3  # Maximum retry attempts
  retry_delay: 1  # Delay between retries in seconds
  
# Model-specific parameter defaults (can be overridden per request)
default_parameters:
  temperature: 0.1
  max_tokens: 4000
  top_p: 0.9
